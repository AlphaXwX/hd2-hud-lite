name: Validate source
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check_repository.py
      - run: python tests/verify_docs.py
      - run: python tools/build.py --source-only
      - run: python tests/verify.py
      - run: python tests/verify_icon_assets.py
      - run: python tests/benchmark.py
      - run: python tests/verify_release.py
